<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ненумеровані списки</title>
</head>
<body>
    <h2>Садові квіти</h2>
    <h3>Поділ за тривалістю життя та типом</h3>
    <ul>
        <li>Багаторічні рослини
            <ul type="circle">
                <li>Півонія</li>
                <li>Хризантема</li>
            </ul>
        </li>
        <li>Цибулинні квіти
            <ul type="square">
                <li>Тюльпан</li>
                <li>Нарцис</li>
            </ul>
        </li>
        <li>Однорічні рослини
            <ul type="disc">
                <li>Чорнобривці</li>
                <li>Петунія</li>
            </ul>
        </li>
    </ul>
</body>
</html>
