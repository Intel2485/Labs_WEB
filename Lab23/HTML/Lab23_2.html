<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City Grid Tycoon</title>
    <link rel="stylesheet" href="../CSS/Lab23_2.css">
</head>
<body>

    <header class="dashboard">
        <div class="stat-box">
            <span class="stat-label">День <span id="ui-day">1</span></span>
            <span class="stat-value" id="ui-event" style="font-size:14px; color:#eab308;">Звичайний день</span>
        </div>
        <div class="stat-box">
            <span class="stat-label">Бюджет ($)</span>
            <span class="stat-value text-green" id="ui-money">1500</span>
        </div>
        <div class="stat-box">
            <span class="stat-label">Будинки 🏠</span>
            <span class="stat-value" id="ui-houses">15</span>
        </div>
        <div class="stat-box">
            <span class="stat-label">Енергомережа (МВт)</span>
            <span class="stat-value text-blue" style="font-size: 16px;" id="ui-grid-stats">Ген: 0 | Спож: 0</span>
        </div>
        <div class="stat-box">
            <span class="stat-label">Енергобанк 🔋</span>
            <span class="stat-value text-green" id="ui-stored">0 МВт</span>
            <button class="action-btn" style="background:#22c55e; color:#000; padding: 2px 6px; font-size:10px; margin-top:4px;" onclick="game.sellEnergy()">Продати енергію</button>
        </div>
        
        <div class="stat-box" id="blackout-warning" style="display: none;">
            <span class="stat-label" style="color: #ef4444;">БЛЕКАУТ! ⚠️</span>
            <span class="stat-value text-red" id="ui-blackout">0/3</span>
        </div>

        <button id="btn-next-turn" class="action-btn next-turn-btn">ЗАВЕРШИТИ ДЕНЬ ⏭</button>
    </header>

    <main class="game-container">
        <section class="grid-board" id="game-board">
            </section>

        <aside class="shop-panel">
            <h2>Ринок Енергетики</h2>
            <div class="shop-items" id="shop-container">
                </div>
            
            <div class="market-info">
                <h3>Біржа</h3>
                <p>Квота на покупку: <span id="market-cap" style="color:#eab308; font-weight:bold;">-- МВт</span></p>
                <p>Продаж (твій прибуток): <span class="text-green" id="market-sell">--</span></p>
                <p>Екстренна закупка: <span class="text-red" id="market-buy">--</span></p>
            </div>
        </aside>
    </main>
    <div id="night-overlay" class="night-overlay hidden">
        <h2 id="night-title">Настала ніч...</h2>
        <div class="night-stats">
            <p id="night-balance">Енергобаланс: --</p>
            <p id="night-finance">Фінанси: --</p>
        </div>
    </div>

    <script src="../JS/Lab23_2.js"></script>
</body>
</html>
